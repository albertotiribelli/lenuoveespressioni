name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type-check, test & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # Many pages query Supabase while they are prerendered. CI has no database and no secrets, so the
      # build talks to scripts/fake-supabase.mjs, which answers every read with an empty result.
      # (The real build still fails when Supabase is unreachable, on purpose.)
      - name: Build
        run: |
          node scripts/fake-supabase.mjs 54321 &
          FAKE_PID=$!
          trap 'kill $FAKE_PID' EXIT
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:54321/__health && break; sleep 0.5; done
          npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_SITE_URL: https://placeholder.vercel.app
