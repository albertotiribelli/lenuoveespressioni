version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for all non-breaking updates, so the small bumps do not pile up as separate PRs.
      minor-and-patch:
        update-types: [minor, patch]
    # Major versions that need a real migration, not just a bump. Minor and patch updates of these still
    # arrive. Remove an entry when you decide to migrate: Dependabot then opens the major PR again.
    ignore:
      - dependency-name: tailwindcss          # v4 replaces tailwind.config.ts and the PostCSS setup
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript           # check Next and the type packages support it first
        update-types: ["version-update:semver-major"]
      - dependency-name: react                # react and react-dom move together with Next
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"        # keep in step with the Node version used in CI (22)
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint               # v9 needs the flat config; lint is not wired up yet
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
